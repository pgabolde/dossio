name: dossio

x-app: &app
    build:
        context: ./docker/php
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    image: dossio-app:dev
    volumes:
        - ./:/var/www/html

services:
    db:
        image: pgvector/pgvector:pg17
        environment:
            POSTGRES_DB: ${DB_DATABASE:-dossio}
            POSTGRES_USER: ${DB_USERNAME:-dossio}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        ports:
            - '127.0.0.1:${DB_FORWARD_PORT:-5432}:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
    ai-service:
        build: ./ai-service
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        volumes:
            - ./ai-service:/app
            - /app/.venv
        ports:
            - '127.0.0.1:8000:8000'
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
    app:
        <<: *app
        depends_on:
            db:
                condition: service_healthy
            ai-service:
                condition: service_healthy
    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    queue:
        <<: *app
        command: php artisan queue:work --tries=3
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            ai-service:
                condition: service_healthy

    vite:
        <<: *app
        command: sh -c "npm install && npm run dev"
        ports:
            - '127.0.0.1:5173:5173'

volumes:
    db-data:
